baseURL                = "https://dfmateus.github.io/"
title                  = "Diego Mateus Blog"
defaultContentLanguage = "en"
theme                  = "blowfish"

enableRobotsTXT = true
summaryLength   = 30
enableEmoji     = true

[pagination]
    pagerSize = 10

[taxonomies]
    tag      = "tags"
    category = "categories"
    series   = "series"

[sitemap]
    changefreq = "daily"
    filename   = "sitemap.xml"
    priority   = 0.5

[outputs]
    home = ["HTML", "RSS", "JSON"]

[related]
    threshold = 0
    toLower   = false

    [[related.indices]]
        name   = "tags"
        weight = 100

    [[related.indices]]
        name   = "categories"
        weight = 100

    [[related.indices]]
        name   = "series"
        weight = 50

    [[related.indices]]
        name   = "date"
        weight = 10
